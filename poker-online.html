<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

</style></head><body><main>
<h1>♠ ポーカー（2〜10人）</h1>
<button id="mb" class="b g" style="display:none;margin:0 0 12px" onclick="togMenu()">☰ メニュー（ホスト用）</button>
<div id="mn" class="box" style="display:none">
<div id="rcw"><h2>部屋コード（ゲームの途中でも入れます）</h2>
<div class="code" id="rc"></div></div>
<h2>ゲームモード（次のゲームから反映）</h2>
<select id="md" onchange="setMode(this.value)"><option value="draw">5枚ドロー</option><option value="holdem">テキサスホールデム</option></select>

<input id="c0" type="number" inputmode="numeric" value="0">
<button class="b" style="margin-top:0" onclick="setChips()">初期チップを反映する</button>
<div id="tow"><h2>持ち時間（時間切れは自動でフォールド）</h2>
<select id="to" onchange="setTmo(this.value)"><option value="30">30秒</option><option value="60">60秒</option><option value="90">90秒</option><option value="120">2分</option><option value="180">3分</option><option value="0">なし（待ち続ける）</option></select></div>

<div id="kl"></div>
</div>
<div id="app"></div>
<button id="lv" class="b g" style="display:none" onclick="leave()">退出する</button>
<p id="rg" class="mu" style="display:none;text-align:center;font-size:13px;margin:8px 0"></p>

</main>
<script>
const $=s=>document.querySelector(s);
const HN=["ハイカード","ワンペア","ツーペア","スリーカード","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ"];
const SU=['♠','♥','♦','♣'],MIN=2,MAX=10,MAXD=6;
// グラフの線: 8色を決まった順に使い、9人目からは同じ色の破線にする
const COL=k=>'var(--s'+(k%8+1)+')',DASH=k=>k>=8?'stroke-dasharray="5 4"':'';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cs=c=>SU[c/13|0]+({11:'J',12:'Q',13:'K',14:'A'}[c%13+2]||c%13+2);
const rd=c=>[1,2].includes(c/13|0);
const SEC={deck:[],hands:[],pos:0,pt:{},r:0};
const rn=n=>{const a=new Uint32Array(1);if(typeof crypto!='undefined')crypto.getRandomValues(a);else a[0]=Math.random()*4294967296;return a[0]%n};
const rid=()=>Array.from({length:16},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[rn(36)]).join('');
function shufA(d){for(let i=d.length-1;i>0;i--){const j=rn(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
const shuf=()=>shufA([...Array(52).keys()]);
function ev(h){
  const r=h.map(c=>c%13+2).sort((a,b)=>b-a),fl=h.every(c=>(c/13|0)==(h[0]/13|0)),n={};
  r.forEach(x=>n[x]=(n[x]||0)+1);
  const g=Object.entries(n).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let k=g.map(x=>x[1]),st=g.length==5&&r[0]-r[4]==4;
  if(g.length==5&&r.join()=="14,5,4,3,2"){st=true;k=[5,4,3,2,1]}
  const cat=st&&fl?8:g[0][0]==4?7:g[0][0]==3&&g[1][0]==2?6:fl?5:st?4:g[0][0]==3?3:g[0][0]==2&&g[1][0]==2?2:g[0][0]==2?1:0;
  return[cat,...k];
}
function best(c){let b=null;const n=c.length;for(let i=0;i<n-4;i++)for(let j=i+1;j<n-3;j++)for(let k=j+1;k<n-2;k++)for(let l=k+1;l<n-1;l++)for(let m=l+1;m<n;m++){const s=ev([c[i],c[j],c[k],c[l],c[m]]);if(!b||cmp(s,b)>0)b=s}return b}
const MN={draw:'5枚ドロー',holdem:'テキサスホールデム'},NEXT={bet1:'bet2',pre:'flop',flop:'turn',turn:'river'};
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};

// ---- ゲーム進行（ホストだけが実行）----
let S={players:[],hist:[],H:null,ante:10};
const ridx=nm=>(S.ro||[]).indexOf(nm);
function chips(nm){const k=ridx(nm);return(S.chips0||0)+(k<0?0:((S.base||[])[k]||0)+S.hist.reduce((t,r)=>t+(r[k]||0),0))}
function toBase(r){const b=S.base=S.base||[];r.forEach((v,k)=>{b[k]=(b[k]||0)+v})}
const alive=H=>[...Array(H.n).keys()].filter(x=>!H.fold[x]);
const myPt=rid();
function ks(pt,r,n){let h=2166136261;const t=pt+':'+r;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}const o=[];for(let i=0;i<n;i++){h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;o.push((h>>>0)%52)}return o}
const encH=(c,pt,r)=>{const k=ks(pt,r,c.length);return c.map((x,i)=>(x+k[i])%52)};
const decH=(c,pt,r)=>{const k=ks(pt,r,c.length);return c.map((x,i)=>(x-k[i]+52)%52)};
// 番・段階・交換の状況が変わったら、その時刻から持ち時間を数え直す
function syncT(){const H=S.H;if(!H||H.phase=='end')return;const k=H.r+'|'+H.phase+'|'+H.turn+'|'+H.disc[H.turn];if(SEC.tk!==k){SEC.tk=k;H.tAt=Date.now()}}
let off=Infinity;
function tmText(){const H=S.H;if(!H||H.phase=='end'||!(S.tmo>0)||!H.tAt||(!isHost&&!isFinite(off)))return'';const now=isHost?Date.now():Date.now()-off;return'残り '+Math.max(0,Math.ceil(S.tmo-(now-H.tAt)/1000))+'秒'}
setInterval(()=>{
  const e=$('#tm');if(e)e.textContent=tmText();
  if(!isHost)return;const H=S.H;
  if(!H||H.phase=='end'||!(S.tmo>0)||!H.tAt||Date.now()-H.tAt<(S.tmo+3)*1000)return; // 通信の遅れのぶん3秒だけ待つ
  const i=H.turn,nm=S.players[i];H.to=[...(H.to||[]),i];lg(nm+' が時間切れ → フォールド');
  if(nm==myName){H.fold[i]=1;H.acted[i]=1;if(alive(H).length==1)endHand(0);else adv(i);bc();render()}
  else apply({t:'leave',name:nm}); // 反応がない人は退出扱い。画面を開いていれば自動で席に戻る
},1000);
function syncHx(){const H=S.H;if(!H)return;if(H.phase=='end'){delete H.hx;return}H.hx=S.players.slice(0,H.n).map((nm,i)=>{const pt=SEC.pt[nm];return pt&&nm!=myName?encH(SEC.hands[i],pt,H.r):null})}
const myHand=(H,i)=>i<0||i>=H.n?null:isHost?(SEC.r==H.r?SEC.hands[i]:null):(H.hx&&H.hx[i]?decH(H.hx[i],myPt,H.r):null);
function seat(){if((S.wait||[]).length){S.players.push(...S.wait);S.wait=[]}}
function startGame(){
  msg='';
  if((S.gone||[]).length)cleanup();
  seat();
  const ae=$('#an'),a=Math.max(1,Math.min(Number.MAX_SAFE_INTEGER/1e3,parseInt(ae?ae.value:S.ante)||10));
  const n=S.players.length;if(n<MIN){bc();render();return}
  if(S.mode!='holdem'&&n>MAXD){msg='5枚ドローは'+MAXD+'人までです。メニューでテキサスホールデムに切り替えてください';bc();render();return}
  const r=(S.hn||0)+1,z=v=>Array(n).fill(v),mode=S.mode=='holdem'?'holdem':'draw',hc=mode=='holdem'?2:5;S.ante=a;
  S.H={r,n,mode,ante:a,phase:mode=='holdem'?'pre':'bet1',turn:(r-1)%n,pot:a*n,inv:z(a),rb:z(0),cb:0,acted:z(0),fold:z(0),disc:z(null),la:z(''),nr:0,ag:z(0)};
  if(solo)S.players.forEach(q=>tnd(q).h++);
  if(mode=='holdem')S.H.board=[];
  SEC.deck=shuf();SEC.r=r;SEC.hands=Array.from({length:n},(_,i)=>SEC.deck.slice(i*hc,i*hc+hc));SEC.pos=n*hc;SEC.dis=[];
  bc();render();
}
function endHand(sd){
  const H=S.H,al=alive(H),hs=SEC.hands;let w=al;
  if(sd&&al.length>1){const sc=hs.map(h=>best(h.concat(H.board||[]))),b=al.reduce((m,i)=>cmp(sc[i],sc[m])>0?i:m,al[0]);w=al.filter(i=>!cmp(sc[i],sc[b]))}
  const dl=Array.from({length:H.n},(_,i)=>-H.inv[i]),sh=Math.floor(H.pot/w.length);
  w.forEach((i,k)=>dl[i]+=sh+(k?0:H.pot-sh*w.length));
  const ro=S.ro=S.ro||[],e=[];S.players.slice(0,H.n).forEach((q,k)=>{let x=ro.indexOf(q);if(x<0)x=ro.push(q)-1;e[x]=dl[k]});for(let x=0;x<ro.length;x++)if(e[x]==null)e[x]=0;
  S.hist.push(e);S.hn=(S.hn||0)+1;
  if(S.hist.length>20)S.hist.splice(0,10).forEach(toBase);
  H.phase='end';H.res={dl,w,sd:sd&&al.length>1,hs:hs.map(h=>h.slice())};
  seat();
  // 中継サービスは1通4KBまで。大きくなったら古い記録から合計にまとめる
  const big=()=>{const t=JSON.stringify({S,ts:Date.now()});return(typeof TextEncoder!='undefined'?new TextEncoder().encode(t).length:t.length*3)>3000};
  while(S.hist.length>1&&big())toBase(S.hist.shift());
}
function adv(i){
  const H=S.H;
  if(alive(H).length==1)return endHand(0);
  for(let k=1;k<H.n;k++){const j=(i+k)%H.n;if(!H.fold[j]&&!(H.acted[j]&&H.rb[j]==H.cb)){H.turn=j;return}}
  const nx=NEXT[H.phase];if(!nx)return endHand(1);
  H.phase=nx;H.rb=Array(H.n).fill(0);H.cb=0;H.nr=0;H.acted=Array(H.n).fill(0);if(H.la)H.la=H.la.map((x,k)=>H.fold[k]?x:'');let t=(H.r-1)%H.n;while(H.fold[t])t=(t+1)%H.n;H.turn=t;
  if(H.mode=='holdem'){const k=nx=='flop'?3:1;for(let x=0;x<k;x++)H.board.push(SEC.deck[SEC.pos++])}
}
function act(i,a,n){
  const H=S.H;
  let lab='フォールド';const nd=H.cb-H.rb[i],tn=solo?tnd(S.players[i]):null;
  if(a=='fold')H.fold[i]=1;
  else{
    let put=H.cb-H.rb[i];lab=put>0?'コール '+put:'チェック';
    if(a=='allin'){const r=chips(S.players[i])-H.inv[i]-put;if(r<=0)return;put+=r;H.cb+=r;H.acted=Array(H.n).fill(0);H.ai=[...(H.ai||[]),i];H.nr=(H.nr||0)+1;if(H.ag)H.ag[i]++;lab='オールイン '+put}
    else if(a=='raise'){n=Math.max(H.ante,Math.min(Number.MAX_SAFE_INTEGER/1e3,parseInt(n)||0));put+=n;H.cb+=n;H.acted=Array(H.n).fill(0);H.nr=(H.nr||0)+1;if(H.ag)H.ag[i]++;lab='レイズ '+n}
    H.rb[i]+=put;H.inv[i]+=put;H.pot+=put;
  }
  if(H.la)H.la[i]=lab;
  if(tn){if(a=='raise'||a=='allin')tn.r++;if(nd>0){if(a=='fold')tn.f++;else tn.c++}}
  H.acted[i]=1;adv(i);
}
// ---- コンピューター（勝率のシミュレーション＋ポットオッズで判断する）----
let solo=false,cpuT=null,CPU_MS=900,SIMS=900; // SIMS: 勝率を出すときの試行回数の目安
const isCpu=nm=>solo&&(S.cpu||[]).includes(nm);
// 5枚ドローの交換の定石: 残すカードの位置を返す
function keepIdx(h){
  const r=h.map(c=>c%13),su=h.map(c=>c/13|0),cat=ev(h)[0],cnt={};r.forEach(x=>cnt[x]=(cnt[x]||0)+1);
  const all=[0,1,2,3,4],of=x=>all.filter(j=>x(j));
  if(cat>=4)return all;                                        // ストレート以上はそのまま
  if(cat==3||cat==7)return of(j=>cnt[r[j]]>=3);                  // スリーカードは3枚残す
  if(cat==2)return of(j=>cnt[r[j]]==2);                          // ツーペアは4枚残す
  const pr=cat==1?+Object.keys(cnt).find(k=>cnt[k]==2):-1;
  if(pr>=9)return of(j=>r[j]==pr);                               // J以上のペアは残す
  const fs=[0,1,2,3].find(t=>su.filter(x=>x==t).length==4);
  if(fs!=null)return of(j=>su[j]==fs);                           // 4枚フラッシュは1枚交換
  const u=[...new Set(r.map(x=>x+2))];for(const x of[...u])if(x==14)u.push(1);
  for(let lo=10;lo>=1;lo--){const need=[lo,lo+1,lo+2,lo+3];if(lo>1&&lo<=10&&need.every(x=>u.includes(x))&&(lo+4<=14)){const v=need.map(x=>x==1?12:x-2);return v.map(x=>r.indexOf(x))}} // 両端が開いた4枚ストレート
  if(pr>=0)return of(j=>r[j]==pr);                               // 小さいペアでも残す
  const hi=all.slice().sort((a,b)=>r[b]-r[a]);return hi.slice(0,r[hi[1]]>=9?2:1);  // 役なし: 高いカードを残す
}
// 山からの抜き取り（シミュレーション用）
function pick(pool,k,ex){ex=ex||[];if(pool.length-ex.length<k)return null;const ix=[];while(ix.length<k){const j=Math.floor(Math.random()*pool.length);if(!ix.includes(j)&&!ex.includes(j))ix.push(j)}return ix}
const rm=(pool,ix)=>{ix.slice().sort((a,b)=>b-a).forEach(j=>{pool[j]=pool[pool.length-1];pool.pop()})};
function drawSim(h,pool){const k=keepIdx(h),ix=pick(pool,5-k.length);if(!ix)return h;const o=k.map(j=>h[j]).concat(ix.map(j=>pool[j]));rm(pool,ix);return o}
// プリフロップの手の強さ（チェンの公式）。6以上が上位25%、8以上が上位11%
function chen(h){const v=h.map(c=>c%13+2).sort((a,b)=>b-a),[a,b]=v;let s=a==14?10:a==13?8:a==12?7:a==11?6:a/2;if(a==b)return Math.max(5,s*2);if((h[0]/13|0)==(h[1]/13|0))s+=2;const g=a-b-1;s-=g<=0?0:g==1?1:g==2?2:g==3?4:5;if(g<=1&&a<12)s+=1;return Math.ceil(s)}
function bcat(bd){const n={};bd.forEach(c=>n[c%13]=(n[c%13]||0)+1);const v=Object.values(n).sort((a,b)=>b-a);return v[0]>=4?7:v[0]==3?3:v[0]==2&&v[1]==2?2:v[0]==2?1:0}
// 手の強さの段階: 0 何もない / 1 ドロー・弱いペア / 2 ペア / 3 ツーペア級 / 4 ストレート以上
function hscore(h,bd,mode){
  if(mode=='holdem'){
    if(!bd.length){const c=chen(h);return c>=8?3:c>=6?2:0}
    const c=h.concat(bd),cat=best(c)[0],bc=bcat(bd);
    if(cat>=4)return 4;if(cat>=2&&cat>bc)return 3;if(cat>bc)return 2;
    if(bd.length<5){const su=[0,0,0,0];c.forEach(x=>su[x/13|0]++);if(su.some((n,t)=>n>=4&&h.some(x=>(x/13|0)==t)))return 1}
    return 0}
  const e=ev(h),cat=e[0];return cat>=4?4:cat>=2?3:cat==1&&e[1]>=11?2:cat==1?1:0;
}
// 相手の傾向（コンピューター対戦のときだけ数える）
const tnd=nm=>{const T=S.tn=S.tn||{};return T[nm]=T[nm]||{h:0,r:0,c:0,f:0}};
// よくレイズする人ほど、レイズに情報がない（ブラフが多い）とみる: 0=ふつう 〜 1=毎回レイズする人
const loose=nm=>{const t=tnd(nm);return t.h<5?0:Math.max(0,Math.min(1,(t.r/t.h-0.2)/0.6))};
const foldRate=nm=>{const t=tnd(nm),n=t.c+t.f;return n>=5?t.f/n:0.45}; // 賭けられたときに降りる割合
// 読み: レイズした相手は、一定の割合でブラフ、残りは強い手を持っているとみる
// ふつうの人なら1回で3割・2回以上で15%。よくレイズする人ほど9割まで上げる
const bluffP=(ag,ls,base)=>{const b=base!=null?base:ag==1?0.3:0.15;return b+(0.9-b)*ls};
const need=ag=>ag==1?2:3;
// 勝率: 自分の札と場の札だけを使い、ほかの人の札は「賭け方と矛盾しない手」を山からランダムに何百回も試す
function equity(H,i,read){
  const me=SEC.hands[i],bd=H.board||[],ops=alive(H).filter(o=>o!=i),sims=Math.min(300,Math.round(SIMS/(ops.length+1)));
  const known=new Set([...me,...bd]),rest=[...Array(52).keys()].filter(c=>!known.has(c));
  const ag=ops.map(o=>read?(H.ag||[])[o]||0:0),ls=ops.map(o=>loose(S.players[o])),pat=ops.map(o=>read&&H.mode!='holdem'&&H.disc[o]===0); // パット（1枚も交換しない）はストレート以上か、ブラフ
  let win=0;
  for(let t=0;t<sims;t++){
    const pool=rest.slice(),sc=[];let my;
    if(H.mode=='holdem'){
      const hs=ops.map((o,k)=>{const so=ag[k]>0&&Math.random()>=bluffP(ag[k],ls[k]);for(let u=0;;u++){const ix=pick(pool,2),h=ix.map(j=>pool[j]);if(u>=120||!so||hscore(h,bd,'holdem')>=need(ag[k])){rm(pool,ix);return h}}});
      const ix=pick(pool,5-bd.length),b=bd.concat(ix.map(j=>pool[j]));rm(pool,ix);
      my=best(me.concat(b));hs.forEach(h=>sc.push(best(h.concat(b))));
    }else{
      ops.forEach((o,k)=>{const so=pat[k]?Math.random()>=bluffP(1,ls[k],0.25):ag[k]>0&&Math.random()>=bluffP(ag[k],ls[k]),nd=pat[k]?4:need(ag[k]);for(let u=0;;u++){

<button class="b" onclick="host()">部屋を作る</button></div>
<div class="box"><input id="cd" inputmode="numeric" placeholder="友達の部屋コード（6桁）">
<button class="b" onclick="joinRoom()">部屋に入る</button>${bk}</div>${M}${!left&&P.length&&P.length+W.length>=MAX?'<p class="mu">満席です（'+MAX+'人まで）。</p>':''}`);return;
  }
  const codeBox=isHost?`<div class="box"><h2>部屋コード</h2><div class="code">${esc(code)}</div></div>`:'';
  const H=S.H;let h=M;
  const c0=S.chips0||0,tot=P.map(chips);
  if(!H||H.phase=='end'){
    h=codeBox+h;
    if(H){const R=H.res;
      h+=`<div class="box"><h2>ゲーム ${H.r} の結果${R.sd?'':'（フォールドで決着）'}</h2>${H.board&&H.board.length?'<p class="mu" style="margin:0 0 6px">場: '+H.board.map(cs).join(' ')+'</p>':''}`+P.slice(0,H.n).map((p,k)=>`<div class="row"><span>${R.w.includes(k)?'🏆':''}${esc(p)} ${R.hs&&R.hs[k]?R.hs[k].map(cs).join(' ')+' <span class="mu">'+rl(R.hs[k].concat(H.board||[]))+(H.fold[k]?'（フォールド）':'')+'</span>':H.fold[k]?'<span class="mu">フォールド</span>':''}</span><b class="${R.dl[k]>=0?'pos':'neg'}">${sg(R.dl[k])}</b></div>`).join('')+'</div>';
    }
    h+=`<div class="box"><h2>参加中（${P.length}/${MAX}人・${MIN}人から開始）</h2>${P.map(esc).join('、')}<p class="mu" style="margin:6px 0 0">次のゲーム: ${MN[S.mode||'draw']}${isHost?'（メニューで変更）':''}</p></div>`;
    h+=isHost?`<div class="box"><h2>参加費（ゲームごとに変更できます）</h2>${(S.gone||[]).length?'<p class="mu">退出した人・時間切れのまま戻っていない人がいます。続けるとその人は外れます。</p>':''}<input id="an" type="number" inputmode="numeric" value="${S.ante}">${P.length<MIN?'<p class="mu">'+MIN+'人以上そろうと始められます</p>':S.mode!='holdem'&&P.length-(S.gone||[]).length>MAXD?'<p class="neg">5枚ドローは'+MAXD+'人までです。メニューでテキサスホールデムに切り替えてください</p>':`<button class="b" onclick="startGame()">${H?'次のゲームを始める':'ゲーム開始'}</button>`}</div>`
      :`<div class="box mu">ホストがゲームを始めるのを待っています…</div>`;
  }else{
    const hd=H.mode=='holdem',PL=P.slice(0,H.n);
    const stage={bet1:'ベット①',bet2:'交換→ベット②',pre:'プリフロップ',flop:'フロップ',turn:'ターン',river:'リバー'}[H.phase];
    h+=`<div class="box"><h2>ゲーム ${H.r}｜${MN[H.mode||'draw']}｜${stage}｜参加費 ${H.ante}｜ポット ${H.pot}</h2>`+PL.map((p,k)=>`<div class="row"><span>${H.turn==k?'▶':''}${esc(p)}${(H.to||[]).includes(k)?' <span class="mu">(時間切れ)</span>':gn.includes(p)?' <span class="mu">(退出)</span>':H.fold[k]?' <span class="mu">(フォールド)</span>':' <span class="mu">'+[H.disc[k]!=null?H.disc[k]+'枚交換':'',(H.la||[])[k]||((H.ai||[]).includes(k)?'オールイン':'')].filter(x=>x).join('・')+'</span>'}</span><span style="white-space:nowrap">持ち ${tot[k]-H.inv[k]}｜投入 ${H.inv[k]}</span></div>`).join('')+(S.tmo>0?`<p class="mu" style="margin:6px 0 0">${esc(P[H.turn])} の番｜<b id="tm">${tmText()}</b>（時間切れは自動でフォールド）</p>`:'')+(W.length?`<p class="mu" style="margin:6px 0 0">次のゲームから参加: ${W.map(esc).join('、')}</p>`:'')+'</div>';
    if(hd)h+=`<div class="box"><h2>場のカード</h2><div class="hand">${[0,1,2,3,4].map(j=>H.board[j]!=null?`<div class="c ${rd(H.board[j])?'r':''}">${cs(H.board[j])}</div>`:'<div class="c" style="opacity:.35">?</div>').join('')}</div></div>`;
    if(wt)h+='<div class="box">いまのゲームが終わったら参加します。このままお待ちください。</div>';
    else{
      const mh=myHand(H,i),pd=!!out,myT=H.turn==i&&!H.fold[i]&&(hd||H.phase=='bet1'||H.disc[i]!=null);
      const key=H.r+H.phase;if(selK!=key){sel=new Set();selK=key}
      const canDraw=!hd&&H.phase=='bet2'&&H.turn==i&&!H.fold[i]&&H.disc[i]==null&&!!mh;
      h+=`<div class="box"><h2>あなたの手札${H.fold[i]?'（フォールド済み）':''}</h2>${mh?cards(mh,canDraw&&!pd,canDraw):'<p class="mu">手札を読み込めません。全員がページを再読み込みして同じ版（いま バージョン '+VER.slice(0,3)+'）にそろえ、同じ名前で入り直してください</p>'}`;
      if(!canDraw&&!H.fold[i]&&mh)h+=`<p class="mu">役: ${rl(mh.concat(H.board||[]))}</p>`;
      if(pd&&(canDraw||myT))h+='<p class="mu">送信中…</p>';
      else if(canDraw)h+=`<button class="b" onclick="drawOK()">${sel.size?sel.size+'枚交換する':'交換しない'}</button><p class="mu">交換したいカードをタップ</p>`;
      else if(myT){const need=H.cb-H.rb[i];
        h+=`<input id="rz" type="number" inputmode="numeric" value="${H.ante}">
<button class="b" onclick="act2('raise')">${need?`コール${need}＋`:''}レイズ（上のぶんを上乗せ）</button>
${tot[i]-H.inv[i]-need>0?`<button class="b a" onclick="allIn()">オールイン（持ちチップ ${tot[i]-H.inv[i]} を全部賭ける）</button>`:''}
<button class="b g" onclick="act2('call')">${need?'コール '+need:'チェック'}</button>
<button class="b x" onclick="act2('fold')">フォールド</button>`}
      else h+=`<p class="mu">${esc(P[H.turn])} の番です…</p>`;
      h+='</div>';
    }
  }
  if(S.hist.length||c0)h+='<div class="box"><h2>チップ（マイナスあり）'+(c0?'｜初期 '+c0:'')+'</h2>'+P.map((p,k)=>`<div class="row"><span>${esc(p)}</span><b class="${tot[k]>=c0?'pos':'neg'}">${c0?tot[k]:sg(tot[k])}</b></div>`).join('')+(H&&H.phase=='end'&&H.res.sd?chart():'')+'</div>';
  setApp(h);
}
render();
</script></body></html>
