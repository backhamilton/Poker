<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー（2〜5人）</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1c20;--cd:#fff;--ac:#2f6fed;--mu:#6b7280;--rd:#d33}
@media(prefers-color-scheme:dark){:root{--bg:#15171b;--fg:#eceef2;--cd:#22252b;--ac:#6c9bff;--mu:#9aa1ad;--rd:#ff7b7b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mu)}
.box{background:var(--cd);border-radius:12px;padding:12px;margin-bottom:12px}
.hand{display:flex;gap:6px}
.c{flex:1;max-width:19%;padding:14px 0;text-align:center;font-size:22px;font-weight:700;border-radius:8px;border:2px solid transparent;background:var(--bg);color:var(--fg)}
.c.r{color:var(--rd)}.c.s{border-color:var(--ac);transform:translateY(-6px)}
button.b,input,select{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--mu);background:var(--cd);color:var(--fg);box-sizing:border-box}
button.b{background:var(--ac);color:#fff;border:0;width:100%;margin-top:8px}
button.g{background:var(--mu)}button.x{background:var(--rd)}
input,select{width:100%;margin-bottom:6px}
button.k{width:auto;margin:0;padding:6px 12px}
#mn h2{margin-top:10px}#mn h2:first-child{margin-top:0}
.row{display:flex;justify-content:space-between;padding:2px 0}.mu{color:var(--mu)}.pos{color:#2b9a4f}.neg{color:var(--rd)}
.code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center}
svg{width:100%;height:auto;display:block}
</style></head><body><main>
<h1>♠ ポーカー（2〜5人）</h1>
<button id="mb" class="b g" style="display:none;margin:0 0 12px" onclick="togMenu()">☰ メニュー（ホスト用）</button>
<div id="mn" class="box" style="display:none">
<h2>部屋コード（ゲームの途中でも入れます）</h2>
<div class="code" id="rc"></div>
<h2>ゲームモード（次のゲームから反映）</h2>
<select id="md" onchange="setMode(this.value)"><option value="draw">5枚ドロー</option><option value="holdem">テキサスホールデム</option></select>
<h2>初期チップ（全員一律）</h2>
<input id="c0" type="number" inputmode="numeric" value="0">
<button class="b" style="margin-top:0" onclick="setChips()">初期チップを反映する</button>
<h2>プレイヤーを退出させる</h2>
<div id="kl"></div>
</div>
<div id="app"></div>
<button id="lv" class="b g" style="display:none" onclick="leave()">退出する</button>
<p id="rg" class="mu" style="display:none;text-align:center;font-size:13px;margin:8px 0"></p>
<details><summary class="mu">接続ログ（つながらないとき見せてください）</summary><pre id="log" style="white-space:pre-wrap;font-size:12px"></pre></details>
</main>
<script>
const $=s=>document.querySelector(s);
const HN=["ハイカード","ワンペア","ツーペア","スリーカード","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ"];
const SU=['♠','♥','♦','♣'],COL=['#2f6fed','#e8590c','#2b9a4f','#a020c0','#c9a800'],MIN=2,MAX=5;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cs=c=>SU[c/13|0]+({11:'J',12:'Q',13:'K',14:'A'}[c%13+2]||c%13+2);
const rd=c=>[1,2].includes(c/13|0);
const SEC={deck:[],hands:[],pos:0,pt:{},r:0};
const rn=n=>{const a=new Uint32Array(1);if(typeof crypto!='undefined')crypto.getRandomValues(a);else a[0]=Math.random()*4294967296;return a[0]%n};
const rid=()=>Array.from({length:16},()=>'abcdefghijklmnopqrstuvwxyz0123456789'[rn(36)]).join('');
function shuf(){const d=[...Array(52).keys()];for(let i=51;i>0;i--){const j=rn(i+1);[d[i],d[j]]=[d[j],d[i]]}return d}
function ev(h){
  const r=h.map(c=>c%13+2).sort((a,b)=>b-a),fl=h.every(c=>(c/13|0)==(h[0]/13|0)),n={};
  r.forEach(x=>n[x]=(n[x]||0)+1);
  const g=Object.entries(n).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let k=g.map(x=>x[1]),st=g.length==5&&r[0]-r[4]==4;
  if(g.length==5&&r.join()=="14,5,4,3,2"){st=true;k=[5,4,3,2,1]}
  const cat=st&&fl?8:g[0][0]==4?7:g[0][0]==3&&g[1][0]==2?6:fl?5:st?4:g[0][0]==3?3:g[0][0]==2&&g[1][0]==2?2:g[0][0]==2?1:0;
  return[cat,...k];
}
function best(c){let b=null;const n=c.length;for(let i=0;i<n-4;i++)for(let j=i+1;j<n-3;j++)for(let k=j+1;k<n-2;k++)for(let l=k+1;l<n-1;l++)for(let m=l+1;m<n;m++){const s=ev([c[i],c[j],c[k],c[l],c[m]]);if(!b||cmp(s,b)>0)b=s}return b}
const MN={draw:'5枚ドロー',holdem:'テキサスホールデム'},NEXT={bet1:'bet2',pre:'flop',flop:'turn',turn:'river'};
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};

// ---- ゲーム進行（ホストだけが実行）----
let S={players:[],hist:[],H:null,ante:10};
const alive=H=>[...Array(H.n).keys()].filter(x=>!H.fold[x]);
const myPt=rid();
function ks(pt,r,n){let h=2166136261;const t=pt+':'+r;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}const o=[];for(let i=0;i<n;i++){h=Math.imul(h^h>>>15,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;o.push((h>>>0)%52)}return o}
const encH=(c,pt,r)=>{const k=ks(pt,r,c.length);return c.map((x,i)=>(x+k[i])%52)};
const decH=(c,pt,r)=>{const k=ks(pt,r,c.length);return c.map((x,i)=>(x-k[i]+52)%52)};
function syncHx(){const H=S.H;if(!H)return;if(H.phase=='end'){delete H.hx;return}H.hx=S.players.slice(0,H.n).map((nm,i)=>{const pt=SEC.pt[nm];return pt&&nm!=myName?encH(SEC.hands[i],pt,H.r):null})}
const myHand=(H,i)=>i<0||i>=H.n?null:isHost?(SEC.r==H.r?SEC.hands[i]:null):(H.hx&&H.hx[i]?decH(H.hx[i],myPt,H.r):null);
function seat(){if((S.wait||[]).length){S.players.push(...S.wait);S.wait=[]}}
function startGame(){
  msg='';
  if((S.gone||[]).length)cleanup();
  seat();
  const a=Math.max(1,Math.min(Number.MAX_SAFE_INTEGER/1e3,parseInt($('#an').value)||10));
  const n=S.players.length;if(n<MIN){bc();render();return}
  const r=(S.hn||0)+1,z=v=>Array(n).fill(v),mode=S.mode=='holdem'?'holdem':'draw',hc=mode=='holdem'?2:5;S.ante=a;
  S.H={r,n,mode,ante:a,phase:mode=='holdem'?'pre':'bet1',turn:(r-1)%n,pot:a*n,inv:z(a),rb:z(0),cb:0,acted:z(0),fold:z(0),disc:z(null)};
  if(mode=='holdem')S.H.board=[];
  SEC.deck=shuf();SEC.r=r;SEC.hands=Array.from({length:n},(_,i)=>SEC.deck.slice(i*hc,i*hc+hc));SEC.pos=n*hc;
  bc();render();
}
function endHand(sd){
  const H=S.H,al=alive(H),hs=SEC.hands;let w=al;
  if(sd&&al.length>1){const sc=hs.map(h=>best(h.concat(H.board||[]))),b=al.reduce((m,i)=>cmp(sc[i],sc[m])>0?i:m,al[0]);w=al.filter(i=>!cmp(sc[i],sc[b]))}
  const dl=Array.from({length:H.n},(_,i)=>-H.inv[i]),sh=Math.floor(H.pot/w.length);
  w.forEach((i,k)=>dl[i]+=sh+(k?0:H.pot-sh*w.length));
  S.hist.push(Object.fromEntries(S.players.map((q,k)=>[q,dl[k]])));S.hn=(S.hn||0)+1;
  if(S.hist.length>20){S.base=S.base||{};S.hist.splice(0,10).forEach(r=>{for(const n in r)S.base[n]=(S.base[n]||0)+r[n]})}H.phase='end';H.res={dl,w,sd:sd&&al.length>1,hs:hs.map(h=>h.slice())};
  seat();
  // 中継サービスは1通4KBまで。大きくなったら古い記録から合計にまとめる
  const big=()=>{const t=JSON.stringify({S,ts:Date.now()});return(typeof TextEncoder!='undefined'?new TextEncoder().encode(t).length:t.length*3)>3000};
  while(S.hist.length>1&&big()){S.base=S.base||{};const r0=S.hist.shift();for(const n in r0)S.base[n]=(S.base[n]||0)+r0[n]}
}
function adv(i){
  const H=S.H;
  if(alive(H).length==1)return endHand(0);
  for(let k=1;k<H.n;k++){const j=(i+k)%H.n;if(!H.fold[j]&&!(H.acted[j]&&H.rb[j]==H.cb)){H.turn=j;return}}
  const nx=NEXT[H.phase];if(!nx)return endHand(1);
  H.phase=nx;H.rb=Array(H.n).fill(0);H.cb=0;H.acted=Array(H.n).fill(0);let t=(H.r-1)%H.n;while(H.fold[t])t=(t+1)%H.n;H.turn=t;
  if(H.mode=='holdem'){const k=nx=='flop'?3:1;for(let x=0;x<k;x++)H.board.push(SEC.deck[SEC.pos++])}
}
function act(i,a,n){
  const H=S.H;
  if(a=='fold')H.fold[i]=1;
  else{
    let put=H.cb-H.rb[i];
    if(a=='raise'){n=Math.max(H.ante,Math.min(Number.MAX_SAFE_INTEGER/1e3,parseInt(n)||0));put+=n;H.cb+=n;H.acted=Array(H.n).fill(0)}
    H.rb[i]+=put;H.inv[i]+=put;H.pot+=put;
  }
  H.acted[i]=1;adv(i);
}
function cleanup(){S.players=S.players.filter(p=>!(S.gone||[]).includes(p));S.gone=[];S.H=null;if(S.sq)for(const k in S.sq)if(!S.players.includes(k))delete S.sq[k]}
function apply(m){
  if(!m||typeof m.name!='string'||!m.name||m.name.length>12)return;
  const before=JSON.stringify(S);let force=false;
  if(m.t=='join'){
    if(m.pt&&/^[a-z0-9]{8,20}$/.test(m.pt))SEC.pt[m.name]=m.pt;
    const W=S.wait||[],mid=S.H&&S.H.phase!='end';
    // ゲームの途中で入った人は待機し、次のゲームから席に着く
    if(!S.players.includes(m.name)&&!W.includes(m.name)&&S.players.length+W.length<MAX){if(mid)S.wait=[...W,m.name];else S.players.push(m.name)}
    S.gone=(S.gone||[]).filter(x=>x!=m.name);S.kicked=(S.kicked||[]).filter(x=>x!=m.name);
    if(m.nonce&&!(S.acks||[]).includes(m.nonce))S.acks=[...(S.acks||[]),m.nonce].slice(-6);
    force=true;
  }
  const H=S.H,i=S.players.indexOf(m.name);
  // 同じ操作が再送されてきたら2回目以降は無視する
  if(m.q&&i>=0&&(m.t=='act'||m.t=='draw')){const sq=S.sq=S.sq||{};if((sq[m.name]||0)>=m.q){render();return}sq[m.name]=m.q}
  if(m.t=='leave'&&(S.wait||[]).includes(m.name))S.wait=S.wait.filter(x=>x!=m.name);
  else if(m.t=='leave'&&i>=0){
    S.gone=[...new Set([...(S.gone||[]),m.name])];
    if(H&&H.phase!='end'){
      if(i<H.n&&!H.fold[i]){H.fold[i]=1;if(alive(H).length==1)endHand(0);else if(H.turn==i)adv(i)}
    }else cleanup();
  }else if(H&&H.phase!='end'&&i>=0&&i<H.n&&!H.fold[i]){
    if(m.t=='act'&&(H.mode=='holdem'||H.phase=='bet1'||(H.phase=='bet2'&&H.disc[i]!=null))&&H.turn==i&&['call','raise','fold'].includes(m.a))act(i,m.a,m.n);
    if(m.t=='draw'&&H.mode!='holdem'&&H.phase=='bet2'&&H.turn==i&&H.disc[i]==null&&Array.isArray(m.d)){const dd=[...new Set(m.d.filter(x=>Number.isInteger(x)&&x>=0&&x<5))].sort();dd.forEach(j=>SEC.hands[i][j]=SEC.deck[SEC.pos++]);H.disc[i]=dd.length}
  }
  if(force||JSON.stringify(S)!==before)bc();
  render();
}

// ---- 通信（ntfy.sh 経由・HTTPS/443。ホストが正）----
const VER='3.1（2026-10-03）';
const NT='https://ntfy.sh/';
const LOG=[];function lg(t){LOG.push(new Date().toTimeString().slice(0,8)+' '+t);const e=$('#log');if(e)e.textContent=LOG.slice(-25).join('\n')}
let left=false,es=null,isHost=false,myName='',code='',msg='',ner='',sel=new Set(),selK='',out=null,gen=0;
try{myName=localStorage.getItem('pk')||''}catch(e){}
const tp=k=>'pinepk'+code+k;
// 今日この端末から送った数（中継サービスは1つの回線につき1日250通まで。日付はUTCで切り替わる）
function cnt(add){const k='pkc'+new Date().toISOString().slice(0,10);let n=0;try{n=+localStorage.getItem(k)||0;if(add){n+=add;localStorage.setItem(k,n)}}catch(e){}return n}
// 送信: 1通ずつ順番に送り、失敗したら間隔をあけて送り直す
const Q=[];let busy=false;
function pub(k,o){Q.push({u:NT+tp(k),b:JSON.stringify(o),st:!!o.S,n:0});pump()}
async function pump(){
  if(busy)return;busy=true;
  while(Q.length){
    const x=Q[0];
    if(x.st&&Q.slice(1).some(y=>y.st&&y.u==x.u)){Q.shift();continue} // もっと新しい状態が後ろにあれば古い方は送らない
    let ok=false,st=0,tx='';
    try{const r=await fetch(x.u,{method:'POST',body:x.b});ok=r.ok;st=r.status;if(!ok)tx=await r.text().catch(()=>'')}catch(e){tx=String(e&&e.message||e)}
    if(ok){Q.shift();cnt(1);if(ner){ner='';render()}continue}
    lg('送信失敗 '+st+' '+tx.slice(0,80));
    ner=/daily|quota/i.test(tx)?'中継サービスの1日の送信上限（1つの回線につき250通）に達しました。日本時間の朝9時ごろにリセットされます。それまでは別の回線（Wi-Fi↔モバイル通信）に切り替えると続けられます':'送信に失敗しています。自動で送り直しています…';
    render();
    if(++x.n>=6){Q.shift();continue}
    await new Promise(r=>setTimeout(r,[1500,3000,5000,8000,12000][x.n-1]||12000));
  }
  busy=false;
}
const bc=()=>{if(!isHost)return;syncHx();S.v=(S.v||0)+1;pub('s',{S,ts:Date.now()})};
const send=m=>isHost?apply(m):pub('a',m);
// 受信: 切れたら自分でつなぎ直し、切れていた間の分も受け取る
const SUBS=new Set();
function sub(k,since,onOpen,onMsg){
  const base=NT+tp(k)+'/sse',o={last:null,at:Date.now(),es:null,dead:false,tm:null};
  o.open=()=>{
    if(o.dead)return;clearTimeout(o.tm);try{o.es&&o.es.close()}catch(e){}
    const sv=o.last||since,e=o.es=new EventSource(base+(sv?'?since='+sv:'')),alive=()=>{o.at=Date.now()};o.at=Date.now();
    e.onopen=ev=>{if(o.es!==e)return;alive();if(ev&&ev.data!==undefined)return;lg('受信接続OK '+k);onOpen&&onOpen()}; // 中継サービスが送る open 通知は数えない
    if(e.addEventListener){e.addEventListener('keepalive',alive);e.addEventListener('open',alive)}
    e.onmessage=ev=>{if(o.es!==e)return;alive();let d,m;try{d=JSON.parse(ev.data);if(d.event!='message')return;if(d.id)o.last=d.id;m=JSON.parse(d.message)}catch(x){return}onMsg(m)};
    e.onerror=()=>{if(o.es!==e||o.dead)return;lg('受信が切れました。つなぎ直します');try{e.close()}catch(x){}o.tm=setTimeout(o.open,2000)};
  };
  o.close=()=>{o.dead=true;clearTimeout(o.tm);try{o.es&&o.es.close()}catch(e){}SUBS.delete(o)};
  SUBS.add(o);o.open();return o;
}
setInterval(()=>SUBS.forEach(o=>{if(Date.now()-o.at>75000){lg('受信が止まっていたので、つなぎ直します');o.open()}}),10000);
if(document.addEventListener)document.addEventListener('visibilitychange',()=>{if(!document.hidden)SUBS.forEach(o=>{if(Date.now()-o.at>10000){lg('画面に戻ったので、つなぎ直します');o.open()}})});
// ゲストの操作: ホストが受け取ったと分かるまで送り直す
function sendAct(m){
  if(isHost){apply(m);return}
  if(out)return;
  m.q=Date.now();out={m,at:Date.now(),n:0};ner='';pub('a',m);render();
}
setInterval(()=>{
  if(!out||Date.now()-out.at<5000)return;
  if(out.n>=4){out=null;ner='操作がホストに届いていません。ホストの画面が開いたままか確認して、もう一度押してください';render();return}
  out.n++;out.at=Date.now();lg('操作を送り直します（'+out.n+'回目）');pub('a',out.m);
},1000);
function name(){const n=$('#nm').value.trim().slice(0,12);if(!n){msg='名前を入れてください';render();return null}
  myName=n;left=false;try{localStorage.setItem('pk',n)}catch(e){}return n}
function reset0(){try{es&&es.close()}catch(e){}es=null;isHost=false;out=null;S={players:[],hist:[],H:null,ante:10};sel=new Set()}
function closeLocal(text){gen++;reset0();left=true;msg=text;render()}
function host(){
  if(!name())return;
  const g=++gen;reset0();ner='';
  code=String(100000+Math.random()*900000|0);msg='接続中…';render();
  let ok=false;
  es=sub('a',null,()=>{
    if(ok||g!=gen)return;ok=true;isHost=true;msg='';
    S={players:[],hist:[],H:null,ante:10,hn:0};
    apply({t:'join',name:myName});lg('部屋 '+code);
  },m=>{if(g==gen&&ok)apply(m)});
  setTimeout(()=>{if(g==gen&&!ok){msg='サーバーに接続できません。ネット接続を確認して、もう一度試してください';try{es.close()}catch(e){}es=null;render()}},10000);
}
function joinRoom(){
  if(!name())return;
  const c=$('#cd').value.trim();
  if(!/^\d{6}$/.test(c)){msg='部屋コードは6桁の数字です';render();return}
  const g=++gen;reset0();ner='';code=c;msg='接続中…';render();
  const nonce=rid().slice(0,6),jm={t:'join',name:myName,nonce,pt:myPt};let got=false,jn=0;
  es=sub('s','latest',()=>{if(g==gen&&!got)pub('a',jm)},m=>{
    if(g!=gen)return;
    if(m.t=='x'){closeLocal('この部屋は閉じています（ホストが退出しました）');return}
    if(!m.S)return;
    if(!got){if(!(m.S.acks||[]).includes(nonce))return;got=true;lg('部屋に参加')}
    else if(S.v!=null&&m.S.v!=null&&m.S.v<S.v)return;
    if((m.S.kicked||[]).includes(myName)){closeLocal('ホストに退出させられました。もう一度入るには、部屋コードを入れ直してください');return}
    S=m.S;msg='';
    if(out&&((S.sq||{})[myName]||0)>=out.m.q)out=null;
    render();
  });
  const jt=setInterval(()=>{if(g!=gen||got||jn++>=3){clearInterval(jt);return}lg('入室を送り直します');pub('a',jm)},4000);
  setTimeout(()=>{if(g==gen&&!got){msg='その部屋に入れません。部屋コード、ホストが部屋を開いたままか、ネット接続を確認してください';render()}},15000);
}
function leave(){
  if(!confirm('退出しますか？'))return;
  if(isHost)pub('s',{t:'x'});else send({t:'leave',name:myName});
  const e=es;es=null;setTimeout(()=>{try{e&&e.close()}catch(x){}},1500);
  gen++;reset0();left=true;msg='退出しました';render();
}
let mo=false;
function togMenu(){mo=!mo;if(mo)$('#c0').value=S.chips0||0;render()}
function setMode(v){if(!isHost)return;S.mode=v=='holdem'?'holdem':'draw';bc();render()}
function setChips(){if(!isHost)return;const v=parseInt($('#c0').value);S.chips0=Number.isFinite(v)?Math.max(-9e12,Math.min(9e12,v)):0;msg='初期チップを '+S.chips0+' にしました';bc();render()}
function kick(k){
  const nm=[...S.players,...(S.wait||[])][k];if(!isHost||nm==null||nm==myName)return;
  if(!confirm(nm+' を退出させますか？'))return;
  S.kicked=[...(S.kicked||[]).filter(x=>x!=nm),nm].slice(-5);delete SEC.pt[nm];
  apply({t:'leave',name:nm});
}
const act2=(a)=>sendAct({t:'act',name:myName,a,n:a=='raise'?$('#rz').value:0});
function drawOK(){sendAct({t:'draw',name:myName,d:[...sel].sort()})}
function tog(i){sel.has(i)?sel.delete(i):sel.add(i);render()}

// ---- 表示 ----
function chart(){
  const n=S.hist.length;if(!n)return'';
  const c0=S.chips0||0,ser=S.players.map(q=>{let s=c0+((S.base||{})[q]||0);return[s,...S.hist.map(r=>s+=(r[q]||0))]});
  const all=ser.flat(),mn=Math.min(...all,c0),mx=Math.max(...all,c0),sp=(mx-mn)||1;
  const X=i=>10+i/n*280,Y=v=>10+(mx-v)/sp*110;
  let s=`<svg viewBox="0 0 300 130"><line x1="10" x2="290" y1="${Y(c0)}" y2="${Y(c0)}" stroke="currentColor" opacity=".3"/>`;
  ser.forEach((a,i)=>s+=`<polyline fill="none" stroke="${COL[i]}" stroke-width="2.5" points="${a.map((v,j)=>X(j)+','+Y(v)).join(' ')}"/>`);
  return s+'</svg>'+S.players.map((p,i)=>`<span style="color:${COL[i]}">● ${esc(p)}</span> `).join('');
}
const sg=v=>(v>0?'+':'')+v;
const rl=c=>c.length>=5?HN[best(c)[0]]:(c.length==2&&c[0]%13==c[1]%13?'ワンペア':'ハイカード');
const cards=(h,click,hl)=>'<div class="hand">'+h.map((c,j)=>`<button class="c ${rd(c)?'r':''} ${hl&&sel.has(j)?'s':''}" ${click?`onclick="tog(${j})"`:'disabled'}>${cs(c)}</button>`).join('')+'</div>';
function render(){
  const A=$('#app'),M=(ner?`<p class="neg">${esc(ner)}</p>`:'')+(msg?`<p class="mu">${esc(msg)}</p>`:''),P=S.players,W=S.wait||[],i=P.indexOf(myName),wt=W.includes(myName),inRoom=(i>=0||wt)&&!left;
  $('#lv').style.display=inRoom?'block':'none';
  $('#rg').style.display=inRoom?'block':'none';$('#rg').textContent=inRoom?'部屋コード '+code+'　｜　今日この端末から送った数（目安） '+cnt(0)+' / 250':'';
  const hostIn=isHost&&i>=0&&!left,gn=S.gone||[];
  $('#mb').style.display=hostIn?'block':'none';$('#mn').style.display=hostIn&&mo?'block':'none';
  if(hostIn){$('#rc').textContent=code;$('#md').value=S.mode||'draw';
    $('#kl').innerHTML=[...P,...W].map((p,k)=>p==myName?'':`<div class="row" style="align-items:center;padding:4px 0"><span>${esc(p)}${W.includes(p)?' <span class="mu">(待機中)</span>':''}</span>${gn.includes(p)?'<span class="mu">退出済み</span>':`<button class="b x k" onclick="kick(${k})">退出させる</button>`}</div>`).join('')||'<p class="mu" style="margin:0">ほかのプレイヤーはいません</p>'}
  if(!inRoom){
    A.innerHTML=`<p class="mu" style="margin:0 0 8px">ポーカー（5枚ドロー／テキサスホールデム・2〜5人）　バージョン ${VER}</p>
<div class="box"><input id="nm" maxlength="12" placeholder="あなたの名前" value="${esc(myName)}">
<button class="b" onclick="host()">部屋を作る</button></div>
<div class="box"><input id="cd" inputmode="numeric" placeholder="友達の部屋コード（6桁）">
<button class="b" onclick="joinRoom()">部屋に入る</button></div>${M}${!left&&P.length&&P.length+W.length>=MAX?'<p class="mu">満席です（'+MAX+'人まで）。</p>':''}`;return;
  }
  const codeBox=isHost?`<div class="box"><h2>部屋コード</h2><div class="code">${esc(code)}</div></div>`:'';
  const H=S.H;let h=M;
  const c0=S.chips0||0,tot=P.map(q=>c0+((S.base||{})[q]||0)+S.hist.reduce((s,r)=>s+(r[q]||0),0));
  if(!H||H.phase=='end'){
    h=codeBox+h;
    if(H){const R=H.res;
      h+=`<div class="box"><h2>ゲーム ${H.r} の結果${R.sd?'':'（フォールドで決着）'}</h2>${H.board&&H.board.length?'<p class="mu" style="margin:0 0 6px">場: '+H.board.map(cs).join(' ')+'</p>':''}`+P.slice(0,H.n).map((p,k)=>`<div class="row"><span>${R.w.includes(k)?'🏆':''}${esc(p)} ${R.hs&&R.hs[k]?R.hs[k].map(cs).join(' ')+' <span class="mu">'+rl(R.hs[k].concat(H.board||[]))+(H.fold[k]?'（フォールド）':'')+'</span>':H.fold[k]?'<span class="mu">フォールド</span>':''}</span><b class="${R.dl[k]>=0?'pos':'neg'}">${sg(R.dl[k])}</b></div>`).join('')+'</div>';
    }
    h+=`<div class="box"><h2>参加中（${P.length}/${MAX}人・${MIN}人から開始）</h2>${P.map(esc).join('、')}<p class="mu" style="margin:6px 0 0">次のゲーム: ${MN[S.mode||'draw']}${isHost?'（メニューで変更）':''}</p></div>`;
    h+=isHost?`<div class="box"><h2>参加費（ゲームごとに変更できます）</h2>${(S.gone||[]).length?'<p class="mu">退出した人がいます。続けるとその人は外れます。</p>':''}<input id="an" type="number" inputmode="numeric" value="${S.ante}">${P.length<MIN?'<p class="mu">'+MIN+'人以上そろうと始められます</p>':`<button class="b" onclick="startGame()">${H?'次のゲームを始める':'ゲーム開始'}</button>`}</div>`
      :`<div class="box mu">ホストがゲームを始めるのを待っています…</div>`;
  }else{
    const hd=H.mode=='holdem',PL=P.slice(0,H.n);
    const stage={bet1:'ベット①',bet2:'交換→ベット②',pre:'プリフロップ',flop:'フロップ',turn:'ターン',river:'リバー'}[H.phase];
    h+=`<div class="box"><h2>ゲーム ${H.r}｜${MN[H.mode||'draw']}｜${stage}｜参加費 ${H.ante}｜ポット ${H.pot}</h2>`+PL.map((p,k)=>`<div class="row"><span>${H.turn==k?'▶':''}${esc(p)}${gn.includes(p)?' <span class="mu">(退出)</span>':H.fold[k]?' <span class="mu">(フォールド)</span>':H.disc[k]!=null?' <span class="mu">'+H.disc[k]+'枚交換</span>':''}</span><span>投入 ${H.inv[k]}</span></div>`).join('')+(W.length?`<p class="mu" style="margin:6px 0 0">次のゲームから参加: ${W.map(esc).join('、')}</p>`:'')+'</div>';
    if(hd)h+=`<div class="box"><h2>場のカード</h2><div class="hand">${[0,1,2,3,4].map(j=>H.board[j]!=null?`<div class="c ${rd(H.board[j])?'r':''}">${cs(H.board[j])}</div>`:'<div class="c" style="opacity:.35">?</div>').join('')}</div></div>`;
    if(wt)h+='<div class="box">いまのゲームが終わったら参加します。このままお待ちください。</div>';
    else{
      const mh=myHand(H,i),pd=!!out,myT=H.turn==i&&!H.fold[i]&&(hd||H.phase=='bet1'||H.disc[i]!=null);
      const key=H.r+H.phase;if(selK!=key){sel=new Set();selK=key}
      const canDraw=!hd&&H.phase=='bet2'&&H.turn==i&&!H.fold[i]&&H.disc[i]==null&&!!mh;
      h+=`<div class="box"><h2>あなたの手札${H.fold[i]?'（フォールド済み）':''}</h2>${mh?cards(mh,canDraw&&!pd,canDraw):'<p class="mu">手札を読み込めません。ページを開き直して、同じ名前で入り直してください</p>'}`;
      if(!canDraw&&!H.fold[i]&&mh)h+=`<p class="mu">役: ${rl(mh.concat(H.board||[]))}</p>`;
      if(pd&&(canDraw||myT))h+='<p class="mu">送信中…</p>';
      else if(canDraw)h+=`<button class="b" onclick="drawOK()">${sel.size?sel.size+'枚交換する':'交換しない'}</button><p class="mu">交換したいカードをタップ</p>`;
      else if(myT){const need=H.cb-H.rb[i];
        h+=`<input id="rz" type="number" inputmode="numeric" value="${H.ante}">
<button class="b" onclick="act2('raise')">${need?`コール${need}＋`:''}レイズ（上のぶんを上乗せ）</button>
<button class="b g" onclick="act2('call')">${need?'コール '+need:'チェック'}</button>
<button class="b x" onclick="act2('fold')">フォールド</button>`}
      else h+=`<p class="mu">${esc(P[H.turn])} の番です…</p>`;
      h+='</div>';
    }
  }
  if(S.hist.length||c0)h+='<div class="box"><h2>チップ（マイナスあり）'+(c0?'｜初期 '+c0:'')+'</h2>'+P.map((p,k)=>`<div class="row"><span>${esc(p)}</span><b class="${tot[k]>=c0?'pos':'neg'}">${c0?tot[k]:sg(tot[k])}</b></div>`).join('')+(H&&H.phase=='end'&&H.res.sd?chart():'')+'</div>';
  A.innerHTML=h;
}
render();
</script></body></html>
