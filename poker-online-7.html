<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ポーカー（2〜5人）</title>
<script src="https://cdn.jsdelivr.net/npm/mqtt@5.3.4/dist/mqtt.min.js"></script>
<style>
:root{--bg:#f6f7f9;--fg:#1a1c20;--cd:#fff;--ac:#2f6fed;--mu:#6b7280;--rd:#d33}
@media(prefers-color-scheme:dark){:root{--bg:#15171b;--fg:#eceef2;--cd:#22252b;--ac:#6c9bff;--mu:#9aa1ad;--rd:#ff7b7b}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,-apple-system,"Noto Sans JP",sans-serif}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:0 0 12px}h2{font-size:15px;margin:0 0 8px;color:var(--mu)}
.box{background:var(--cd);border-radius:12px;padding:12px;margin-bottom:12px}
.hand{display:flex;gap:6px}
.c{flex:1;padding:14px 0;text-align:center;font-size:22px;font-weight:700;border-radius:8px;border:2px solid transparent;background:var(--bg);color:var(--fg)}
.c.r{color:var(--rd)}.c.s{border-color:var(--ac);transform:translateY(-6px)}
button.b,input{font:inherit;padding:10px 14px;border-radius:8px;border:1px solid var(--mu);background:var(--cd);color:var(--fg);box-sizing:border-box}
button.b{background:var(--ac);color:#fff;border:0;width:100%;margin-top:8px}
button.g{background:var(--mu)}button.x{background:var(--rd)}
input{width:100%;margin-bottom:6px}
.row{display:flex;justify-content:space-between;padding:2px 0}.mu{color:var(--mu)}.pos{color:#2b9a4f}.neg{color:var(--rd)}
.code{font-size:32px;font-weight:700;letter-spacing:6px;text-align:center}
svg{width:100%;height:auto;display:block}
</style></head><body><main>
<h1>♠ ポーカー（5枚ドロー・2〜5人）</h1>
<div id="app"></div>
<button id="lv" class="b g" style="display:none" onclick="leave()">退出する</button>
<details><summary class="mu">接続ログ（つながらないとき見せてください）</summary><pre id="log" style="white-space:pre-wrap;font-size:12px"></pre></details>
</main>
<script>
const $=s=>document.querySelector(s);
const HN=["ハイカード","ワンペア","ツーペア","スリーカード","ストレート","フラッシュ","フルハウス","フォーカード","ストレートフラッシュ"];
const SU=['♠','♥','♦','♣'],COL=['#2f6fed','#e8590c','#2b9a4f','#a020c0','#c9a800'],MIN=2,MAX=5;
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cs=c=>SU[c/13|0]+({11:'J',12:'Q',13:'K',14:'A'}[c%13+2]||c%13+2);
const rd=c=>[1,2].includes(c/13|0);
function rng(a){return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function deck(r){const d=[...Array(52).keys()],f=rng(r*7919+S.seed);for(let i=51;i>0;i--){const j=f()*(i+1)|0;[d[i],d[j]]=[d[j],d[i]]}return d}
function ev(h){
  const r=h.map(c=>c%13+2).sort((a,b)=>b-a),fl=h.every(c=>(c/13|0)==(h[0]/13|0)),n={};
  r.forEach(x=>n[x]=(n[x]||0)+1);
  const g=Object.entries(n).map(([k,v])=>[v,+k]).sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
  let k=g.map(x=>x[1]),st=g.length==5&&r[0]-r[4]==4;
  if(g.length==5&&r.join()=="14,5,4,3,2"){st=true;k=[5,4,3,2,1]}
  const cat=st&&fl?8:g[0][0]==4?7:g[0][0]==3&&g[1][0]==2?6:fl?5:st?4:g[0][0]==3?3:g[0][0]==2&&g[1][0]==2?2:g[0][0]==2?1:0;
  return[cat,...k];
}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};

// ---- ゲーム進行（ホストだけが実行）----
let S={seed:1,players:[],hist:[],H:null,ante:10};
const alive=H=>[...Array(H.n).keys()].filter(x=>!H.fold[x]);
function hands(){const H=S.H,d=deck(H.r);return[...Array(H.n).keys()].map(i=>{const h=d.slice(i*5,i*5+5);(H.disc[i]||[]).forEach((j,k)=>h[j]=d[H.n*5+i*5+k]);return h})}
function startGame(){
  if((S.gone||[]).length)cleanup();
  const a=Math.min(1000,Math.max(1,parseInt($('#an').value)||10));
  const n=S.players.length;if(n<MIN){bc();render();return}
  const r=S.hist.length+1,z=v=>Array(n).fill(v);S.ante=a;
  S.H={r,n,ante:a,phase:'bet1',turn:(r-1)%n,pot:a*n,inv:z(a),rb:z(0),cb:0,acted:z(0),fold:z(0),disc:z(null)};
  bc();render();
}
function endHand(sd){
  const H=S.H,al=alive(H),hs=hands();let w=al;
  if(sd&&al.length>1){const sc=hs.map(ev),b=al.reduce((m,i)=>cmp(sc[i],sc[m])>0?i:m,al[0]);w=al.filter(i=>!cmp(sc[i],sc[b]))}
  const dl=Array.from({length:H.n},(_,i)=>-H.inv[i]),sh=Math.floor(H.pot/w.length);
  w.forEach((i,k)=>dl[i]+=sh+(k?0:H.pot-sh*w.length));
  S.hist.push(Object.fromEntries(S.players.map((q,k)=>[q,dl[k]])));H.phase='end';H.res={dl,w,sd:sd&&al.length>1,hs};
}
function adv(i){
  const H=S.H;
  if(alive(H).length==1)return endHand(0);
  for(let k=1;k<H.n;k++){const j=(i+k)%H.n;if(!H.fold[j]&&!(H.acted[j]&&H.rb[j]==H.cb)){H.turn=j;return}}
  if(H.phase=='bet1'){H.phase='bet2';H.rb=Array(H.n).fill(0);H.cb=0;H.acted=Array(H.n).fill(0);let t=(H.r-1)%H.n;while(H.fold[t])t=(t+1)%H.n;H.turn=t}else endHand(1);
}
function act(i,a,n){
  const H=S.H;
  if(a=='fold')H.fold[i]=1;
  else{
    let put=H.cb-H.rb[i];
    if(a=='raise'){n=Math.min(1000,Math.max(H.ante,parseInt(n)||0));put+=n;H.cb+=n;H.acted=Array(H.n).fill(0)}
    H.rb[i]+=put;H.inv[i]+=put;H.pot+=put;
  }
  H.acted[i]=1;adv(i);
}
function cleanup(){S.players=S.players.filter(p=>!(S.gone||[]).includes(p));S.gone=[];S.H=null}
function apply(m){
  if(m.t=='join'){if(!S.players.includes(m.name)&&S.players.length<MAX&&(!S.H||S.H.phase=='end'))S.players.push(m.name);S.gone=(S.gone||[]).filter(x=>x!=m.name)}
  const H=S.H,i=S.players.indexOf(m.name);
  if(m.t=='leave'&&i>=0){
    S.gone=[...new Set([...(S.gone||[]),m.name])];
    if(H&&H.phase!='end'){
      if(!H.fold[i]){H.fold[i]=1;if(alive(H).length==1)endHand(0);else if(H.turn==i)adv(i)}
    }else cleanup();
  }else if(H&&i>=0&&!H.fold[i]){
    if(m.t=='act'&&(H.phase=='bet1'||(H.phase=='bet2'&&H.disc[i]!=null))&&H.turn==i&&['call','raise','fold'].includes(m.a))act(i,m.a,m.n);
    if(m.t=='draw'&&H.phase=='bet2'&&H.turn==i&&H.disc[i]==null&&Array.isArray(m.d))H.disc[i]=m.d.slice(0,5);
  }
  bc();render();
}

// ---- 通信（公開MQTTサーバー経由の中継。ホストが正）----
const VER='2.1（2026-09-30）';
const BR=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt'];
const LOG=[];function lg(t){LOG.push(new Date().toTimeString().slice(0,8)+' '+t);const e=$('#log');if(e)e.textContent=LOG.slice(-25).join('\n')}
let left=false,cl=null,hb=null,isHost=false,myName='',code='',msg='',sel=new Set(),selK='';
try{myName=localStorage.getItem('pk')||''}catch(e){}
const tp=s=>'pinepk/'+code+'/'+s;
function pub(t,o){if(cl&&cl.connected)cl.publish(tp(t),JSON.stringify(o),{qos:1,retain:t=='s'&&!o.t})}
const bc=()=>{if(isHost)pub('s',{S,ts:Date.now()})};
const send=m=>isHost?apply(m):pub('a',m);
function name(){const n=$('#nm').value.trim().slice(0,12);if(!n){msg='名前を入れてください';render();return null}
  myName=n;left=false;try{localStorage.setItem('pk',n)}catch(e){}return n}
function conn(bi,cb){
  lg('接続 '+BR[bi].slice(6,22));
  const c=mqtt.connect(BR[bi],{clientId:'pk'+Math.random().toString(36).slice(2,10),clean:true,connectTimeout:8000,reconnectPeriod:3000});
  let done=false;
  const fin=ok=>{if(done)return;done=true;if(!ok)try{c.end(true)}catch(e){}cb(ok?c:null)};
  c.on('connect',()=>{lg('サーバー接続OK');fin(true)});
  c.on('error',e=>{lg('mqtt error '+(e.message||e));fin(false)});
  c.on('close',()=>{lg('切断');fin(false)});
  c.on('reconnect',()=>lg('再接続中'));
  setTimeout(()=>fin(false),9000);
}
function closeLocal(text){try{cl&&cl.end(true)}catch(e){}cl=null;isHost=false;clearInterval(hb);S={seed:1,players:[],hist:[],H:null,ante:10};left=true;msg=text;sel=new Set();render()}
function host(){
  if(!name())return;
  if(typeof mqtt=='undefined'){msg='通信ライブラリを読み込めませんでした。ファイルをChromeで開き直してください';render();return}
  msg='接続中…';render();
  const tryB=bi=>{
    if(bi>=BR.length){msg='サーバーに接続できません。ネット接続を確認して、もう一度試してください';render();return}
    conn(bi,c=>{
      if(!c)return tryB(bi+1);
      cl=c;code=bi+String(10000+Math.random()*90000|0);isHost=true;msg='';
      c.subscribe(tp('a'),{qos:1});
      c.on('message',(t,p)=>{try{apply(JSON.parse(p.toString()))}catch(e){}});
      S={seed:Math.random()*1e6|0,players:[],hist:[],H:null,ante:10};
      apply({t:'join',name:myName});
      hb=setInterval(bc,15000);lg('部屋 '+code);
    });
  };
  tryB(0);
}
function joinRoom(){
  if(!name())return;
  if(typeof mqtt=='undefined'){msg='通信ライブラリを読み込めませんでした。ファイルをChromeで開き直してください';render();return}
  code=$('#cd').value.trim();const bi=+code[0];
  if(code.length!=6||!BR[bi]){msg='部屋コードは6桁の数字です';render();return}
  msg='接続中…';render();
  conn(bi,c=>{
    if(!c){msg='サーバーに接続できません。ネット接続を確認して、もう一度試してください';render();return}
    cl=c;isHost=false;let got=false;
    c.on('message',(t,p)=>{
      let m;try{m=JSON.parse(p.toString())}catch(e){return}
      if(m.t=='x'){closeLocal('ホストが退出したため部屋が閉じました');return}
      if(!m.S||(!got&&Date.now()-m.ts>60000))return;
      if(!got)lg('部屋の状態を受信');
      got=true;S=m.S;msg='';render();
    });
    c.subscribe(tp('s'),{qos:1},()=>pub('a',{t:'join',name:myName}));
    setTimeout(()=>{if(!got){msg='その部屋コードは見つかりません。コードと、ホストが部屋を開いたままか確認してください';render()}},8000);
  });
}
function leave(){
  if(!confirm('退出しますか？'))return;
  const c=cl,t=tp('s'),h=isHost;
  if(h)pub('s',{t:'x'});else send({t:'leave',name:myName});
  setTimeout(()=>{try{if(h)c.publish(t,'',{qos:1,retain:true});c.end()}catch(e){}},600);
  cl=null;isHost=false;clearInterval(hb);
  S={seed:1,players:[],hist:[],H:null,ante:10};left=true;msg='退出しました';sel=new Set();render();
}
const act2=(a)=>send({t:'act',name:myName,a,n:a=='raise'?$('#rz').value:0});
function drawOK(){send({t:'draw',name:myName,d:[...sel].sort()});sel=new Set()}
function tog(i){sel.has(i)?sel.delete(i):sel.add(i);render()}

// ---- 表示 ----
function chart(){
  const n=S.hist.length;if(!n)return'';
  const ser=S.players.map(q=>{let s=0;return[0,...S.hist.map(r=>s+=(r[q]||0))]});
  const all=ser.flat(),mn=Math.min(...all,0),mx=Math.max(...all,0),sp=(mx-mn)||1;
  const X=i=>10+i/n*280,Y=v=>10+(mx-v)/sp*110;
  let s=`<svg viewBox="0 0 300 130"><line x1="10" x2="290" y1="${Y(0)}" y2="${Y(0)}" stroke="currentColor" opacity=".3"/>`;
  ser.forEach((a,i)=>s+=`<polyline fill="none" stroke="${COL[i]}" stroke-width="2.5" points="${a.map((v,j)=>X(j)+','+Y(v)).join(' ')}"/>`);
  return s+'</svg>'+S.players.map((p,i)=>`<span style="color:${COL[i]}">● ${esc(p)}</span> `).join('');
}
const sg=v=>(v>0?'+':'')+v;
const cards=(h,fn)=>'<div class="hand">'+h.map((c,j)=>`<button class="c ${rd(c)?'r':''} ${fn&&sel.has(j)?'s':''}" ${fn?`onclick="tog(${j})"`:'disabled'}>${cs(c)}</button>`).join('')+'</div>';
function render(){
  const A=$('#app'),M=msg?`<p class="mu">${esc(msg)}</p>`:'',P=S.players,i=P.indexOf(myName);
  $('#lv').style.display=(i>=0&&!left)?'block':'none';
  if(i<0||left){
    A.innerHTML=`<p class="mu" style="margin:0 0 8px">ポーカー（5枚ドロー・ベットあり・2〜5人）　バージョン ${VER}</p>
<div class="box"><input id="nm" maxlength="12" placeholder="あなたの名前" value="${esc(myName)}">
<button class="b" onclick="host()">部屋を作る</button></div>
<div class="box"><input id="cd" inputmode="numeric" placeholder="友達の部屋コード（6桁）">
<button class="b" onclick="joinRoom()">部屋に入る</button></div>${M}${!left&&S.players.length?(S.players.length>=MAX?'<p class="mu">満席です（'+MAX+'人まで）。</p>':S.H&&S.H.phase!='end'?'<p class="mu">ゲーム進行中は入れません。次のゲームが始まる前にもう一度入ってください。</p>':''):''}`;return;
  }
  const codeBox=isHost?`<div class="box"><h2>部屋コード</h2><div class="code">${esc(code)}</div></div>`:'';
  const H=S.H;let h=M;
  const tot=P.map(q=>S.hist.reduce((s,r)=>s+(r[q]||0),0));
  if(!H||H.phase=='end'){
    h=codeBox+h;
    if(H){const R=H.res;
      h+=`<div class="box"><h2>ゲーム ${H.r} の結果${R.sd?'':'（フォールドで決着）'}</h2>`+P.slice(0,H.n).map((p,k)=>`<div class="row"><span>${R.w.includes(k)?'🏆':''}${esc(p)} ${R.sd&&!H.fold[k]?R.hs[k].map(cs).join(' ')+' <span class="mu">'+HN[ev(R.hs[k])[0]]+'</span>':H.fold[k]?'<span class="mu">フォールド</span>':''}</span><b class="${R.dl[k]>=0?'pos':'neg'}">${sg(R.dl[k])}</b></div>`).join('')+'</div>';
    }
    h+=`<div class="box"><h2>参加中（${P.length}/${MAX}人・${MIN}人から開始）</h2>${P.map(esc).join('、')}</div>`;
    h+=isHost?`<div class="box"><h2>参加費（ゲームごとに変更できます）</h2>${(S.gone||[]).length?'<p class="mu">退出した人がいます。続けるとその人は外れます。</p>':''}<input id="an" type="number" inputmode="numeric" value="${S.ante}">${P.length<MIN?'<p class="mu">'+MIN+'人以上そろうと始められます</p>':`<button class="b" onclick="startGame()">${H?'次のゲームを始める':'ゲーム開始'}</button>`}</div>`
      :`<div class="box mu">ホストがゲームを始めるのを待っています…</div>`;
  }else{
    const hs=hands(),myT=H.turn==i&&(H.phase=='bet1'||H.disc[i]!=null);
    const stage={bet1:'ベット①',bet2:'交換→ベット②'}[H.phase];
    h+=`<div class="box"><h2>ゲーム ${H.r}｜${stage}｜参加費 ${H.ante}｜ポット ${H.pot}</h2>`+P.map((p,k)=>`<div class="row"><span>${H.turn==k?'▶':''}${esc(p)}${H.fold[k]?' <span class="mu">(フォールド)</span>':H.disc[k]!=null?' <span class="mu">'+H.disc[k].length+'枚交換</span>':''}</span><span>投入 ${H.inv[k]}</span></div>`).join('')+'</div>';
    const key=H.r+H.phase;if(selK!=key){sel=new Set();selK=key}
    const canDraw=H.phase=='bet2'&&H.turn==i&&!H.fold[i]&&H.disc[i]==null;
    h+=`<div class="box"><h2>あなたの手札${H.fold[i]?'（フォールド済み）':''}</h2>${cards(hs[i],canDraw)}`;
    if(canDraw)h+=`<button class="b" onclick="drawOK()">${sel.size?sel.size+'枚交換する':'交換しない'}</button><p class="mu">交換したいカードをタップ</p>`;
    else if(!H.fold[i])h+=`<p class="mu">役: ${HN[ev(hs[i])[0]]}</p>`;
    if(myT){const need=H.cb-H.rb[i];
      h+=`<input id="rz" type="number" inputmode="numeric" value="${H.ante}">
<button class="b" onclick="act2('raise')">${need?`コール${need}＋`:''}レイズ（上のぶんを上乗せ）</button>
<button class="b g" onclick="act2('call')">${need?'コール '+need:'チェック'}</button>
<button class="b x" onclick="act2('fold')">フォールド</button>`}
    else if(!canDraw)h+=`<p class="mu">${esc(P[H.turn])} の番です…</p>`;
    h+='</div>';
  }
  if(S.hist.length)h+='<div class="box"><h2>チップ（マイナスあり）</h2>'+P.map((p,k)=>`<div class="row"><span>${esc(p)}</span><b class="${tot[k]>=0?'pos':'neg'}">${sg(tot[k])}</b></div>`).join('')+(H&&H.phase=='end'&&H.res.sd?chart():'')+'</div>';
  A.innerHTML=h;
}
render();
</script></body></html>
